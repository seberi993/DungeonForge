<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DungeonForge</title>
    <meta name="description" content="Co-op, AI-narrated dungeon crawler. Form a party, type what you do, and survive the dungeon." />
    <meta name="theme-color" content="#0b0a14" />
    <base href="/" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9A%94%EF%B8%8F%3C/text%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Press+Start+2P&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/app.css" />
</head>
<body>
    <div id="app"><div class="boot"><div>DUNGEONFORGE</div><div class="boot-bar"></div><div>Loading...</div></div></div>
    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
    </div>
    <script>
        window.dungeonForge = {
            copyText: function (text) {
                return navigator.clipboard.writeText(text);
            },
            selectText: function (id) {
                var el = document.getElementById(id);
                if (el) { el.focus(); el.select(); }
            },
            scrollToBottom: function (id) {
                var el = document.getElementById(id);
                if (el) { el.scrollTop = el.scrollHeight; }
            }
        };
    </script>
    <script src="js/sfx.js"></script>
    <script src="_framework/blazor.webassembly.js"></script>
</body>
</html>
